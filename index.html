<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10X CRM — Log in</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/main.css">
</head>
<body class="auth-page">
    <div class="auth-layout">
        <header class="auth-topbar">
            <a href="index.html" class="auth-topbar__brand">10X CRM</a>
            <button type="button" id="themeToggle" class="auth-topbar__theme" aria-label="Toggle theme">
                Theme
            </button>
        </header>

        <main class="auth-center">
            <div class="auth-card">
                <h1>Welcome back</h1>
                <p class="auth-subtitle">Sign in to continue to your dashboard.</p>
                <form id="loginForm" class="auth-form" novalidate>
                    <div class="form-group">
                        <input type="email" id="loginEmail" placeholder="Email" autocomplete="email" required>
                    </div>
                    <div class="form-group">
                        <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password" required>
                    </div>
                    <button type="submit" class="btn-primary">Log in</button>
                </form>
                <div class="auth-links">
                    Don't have an account? <a href="signup.html">Sign up</a>
                </div>
            </div>
        </main>
    </div>
    <script type="module" src="js/auth-app.js"></script>
</body>
</html>
