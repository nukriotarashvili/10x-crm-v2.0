<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10X CRM - Profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="brand" id="logoBrand">10X CRM</div>
            <nav class="nav-links">
                <a href="dashboard.html">Dashboard</a>
                <a href="clients.html">Clients</a>
                <a href="profile.html" class="active">Profile</a>
            </nav>
            <div class="sidebar-footer">
                <button id="themeToggle">Theme 🌓</button>
                <button id="logoutBtn">Logout</button>
            </div>
        </aside>

        <main class="main-content">
            <div class="page-header">
                <h1>Profile</h1>
            </div>

            <div class="panel" id="profileInfoBlock">
                Loading profile...
            </div>

            <div class="profile-forms">
                <div class="panel" id="editProfilePanel">
                    <h3>Edit Profile</h3>
                    <form id="editProfileForm" class="profile-form" novalidate>
                        <div class="form-group">
                            <input type="text" id="editName" placeholder="Full Name" required>
                        </div>
                        <div class="form-group">
                            <input type="text" id="editCompany" placeholder="Company">
                        </div>
                        <button type="submit" class="btn-primary">Save Changes</button>
                    </form>
                </div>

                <div class="panel" id="changePasswordPanel">
                    <h3>Change Password</h3>
                    <form id="changePasswordForm" class="profile-form" novalidate>
                        <div class="form-group">
                            <input type="password" id="currentPass" placeholder="Current Password" required>
                        </div>
                        <div class="form-group">
                            <input type="password" id="newPass" placeholder="New Password" required>
                        </div>
                        <div class="form-group">
                            <input type="password" id="confirmNewPass" placeholder="Confirm New Password" required>
                        </div>
                        <button type="submit" class="btn-primary">Change Password</button>
                    </form>
                </div>

                <div class="panel panel--danger">
                    <h3>Data</h3>
                    <button type="button" id="resetDataBtn" class="btn-danger">Reset CRM Data</button>
                </div>
            </div>
        </main>
    </div>
    <script type="module" src="js/app.js"></script>
</body>
</html>
