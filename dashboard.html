<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10X CRM - Dashboard</title>
    <link rel="stylesheet" href="styles/main.css">
    <script type="module" src="https://unpkg.com/@splinetool/viewer@1.9.4/build/spline-viewer.js"></script>
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="brand" id="logoBrand">10X CRM</div>
            <nav class="nav-links">
                <a href="dashboard.html" class="active">Dashboard</a>
                <a href="clients.html">Clients</a>
                <a href="profile.html">Profile</a>
            </nav>
            <div class="sidebar-footer">
                <button id="themeToggle">Theme 🌓</button>
                <button id="logoutBtn">Logout</button>
            </div>
        </aside>

        <main class="main-content">
            <div class="dashboard-hero panel">
                <div class="hero-text">
                    <h1 id="welcomeMessage">Welcome back!</h1>
                    <div id="liveClock" class="clock"></div>
                    <p class="subtitle">Here is your business overview for today.</p>
                </div>
                <div class="hero-3d" aria-hidden="true">
                    <spline-viewer url="https://prod.spline.design/6Wq1Q7YGyM-iab9i/scene.splinecode"></spline-viewer>
                </div>
            </div>

            <div id="dashboardContent" class="panel">
                Dashboard metrics will be rendered here.
            </div>
        </main>
    </div>
    <script type="module" src="js/app.js"></script>
</body>
</html>
