<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10X CRM - Sign Up</title>
    <link rel="stylesheet" href="styles/main.css">
    <script type="module" src="https://unpkg.com/@splinetool/viewer@1.9.4/build/spline-viewer.js"></script>
</head>
<body>
    <div class="auth-layout">
        <div class="auth-visuals" aria-hidden="true">
            <spline-viewer url="https://prod.spline.design/your-scene-url/scene.splinecode"></spline-viewer>
        </div>

        <div class="auth-container">
            <div class="auth-card">
                <h1>Create your account</h1>
                <form id="signupForm" novalidate>
                    <div class="form-group">
                        <input type="text" id="signupName" placeholder="Full Name" required>
                    </div>
                    <div class="form-group">
                        <input type="email" id="signupEmail" placeholder="Email" required>
                    </div>
                    <div class="form-group">
                        <input type="text" id="signupCompany" placeholder="Company (optional)">
                    </div>
                    <div class="form-group">
                        <input type="password" id="signupPassword" placeholder="Password" required>
                    </div>
                    <div class="form-group">
                        <input type="password" id="signupConfirmPassword" placeholder="Confirm Password" required>
                    </div>
                    <button type="submit">Create Account</button>
                </form>
                <div class="auth-links">
                    Already have an account? <a href="index.html">Log in</a>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="js/app.js"></script>
</body>
</html>
