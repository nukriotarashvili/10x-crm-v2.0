<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10X CRM - Login</title>
    <link rel="stylesheet" href="styles/main.css">
    <script type="module" src="https://unpkg.com/@splinetool/viewer@1.9.4/build/spline-viewer.js"></script>
</head>
<body>
    <div class="auth-layout">
        <div class="auth-visuals" aria-hidden="true">
            <!-- შეცვალეთ URL თქვენი Spline სცენით Export → Viewer -->
            <spline-viewer url="https://prod.spline.design/your-scene-url/scene.splinecode"></spline-viewer>
        </div>

        <div class="auth-container">
            <div class="auth-card">
                <h1>Welcome back</h1>
                <form id="loginForm" novalidate>
                    <div class="form-group">
                        <input type="email" id="loginEmail" placeholder="Email" required>
                    </div>
                    <div class="form-group">
                        <input type="password" id="loginPassword" placeholder="Password" required>
                    </div>
                    <button type="submit">Log In</button>
                </form>
                <div class="auth-links">
                    Don't have an account? <a href="signup.html">Sign up</a>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="js/app.js"></script>
</body>
</html>
